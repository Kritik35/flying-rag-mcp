name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # как в боевом venv; 3.13 проверял не тот стек

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock  # точные версии боевого стека

      - name: Provide config from example
        run: copy config.example.yaml config.yaml

      # The whole suite, not a hand-picked list: a list goes stale as tests
      # are added, and it ran 92 of 603 tests. Tests that need a
      # live Lemonade or the operator's index skip themselves without one.
      - name: Run the test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t .

      - name: Compile core modules
        run: |
          python -m py_compile main.py indexer.py reindex_all.py embedder\client.py embedder\batcher.py chunker\semantic.py storage\vector_store.py storage\metadata_db.py storage\graph.py storage\rules_maintenance.py storage\write_lock.py rag_server\tools.py rag_server\server.py rag_server\query_planner.py rag_server\rerank_policy.py rag_server\retrieval_quality.py structured_values\extractor.py structured_values\report.py scripts\extract_structured_values.py scripts\dedup_engineering_rules.py scripts\store_recovery.py scripts\backup_store.py backfill_rules.py
