version: 1
confidence:
  confident: 0.62
  ambiguous_gap: 0.12
  # cross-dataset conflict ratio: if the runner-up is from a different dataset
  # and reaches this fraction of the top score, the route is ambiguous and we
  # do NOT bias the search toward one side.
  cross_dataset_ratio: 0.4

domains:
  - id: project_ov2
    label: project_ov2
    dataset: project
    folder_filter: ОВ2
    terms:
      - ов2
      - противодымная вентиляция
      - дымоудаление
      - подпор
      - пв
      - дв
      - вентиляция
      - проектные решения
      - лист
      - система
      - схема
    patterns:
      - "(?i)(?<![a-zа-я0-9])ов2(?![a-zа-я0-9])"

  - id: normative_fire
    label: normative_fire
    dataset: normative
    folder_filter: null
    terms:
      - сп 7
      - 7.13130
      - противодым
      - дымоудал
      - дымозащит
      - подпор
      - пожар
      - эвакуац
      - сп 1
      - 1.13130
      - 123-фз
      # Инженер спрашивает «удаление дыма», а не «противодымная вентиляция».
      # Без этих форм два базовых вопроса про дымоудаление набирали ноль и
      # уходили в default: без датасета и без расширения запроса.
      - удаление дыма
      - удалени дыма
      - дыма
      - продуктов горения
      - продукты горения
      - незадымляем
      - лестничн
    patterns:
      - "(?i)сп\\s*7(?:\\.13130)?"
      - "(?i)7\\.13130"

  - id: normative_hvac
    label: normative_hvac
    dataset: normative
    folder_filter: null
    terms:
      - сп 60
      - 60.13330
      - отопление
      - вентиляция
      - кондиционирование
      - воздухообмен
      - микроклимат
      - утилизация теплоты
      - рекуперация
      - рекуператор
      - приточн
      - удаляемого воздуха
      - утилизац
      - рекупер
      - подогрев
      # «вытяжн» сознательно не добавлено: оно есть и в «вытяжная противодымная
      # вентиляция», и перетянуло бы противопожарные вопросы сюда.
    patterns:
      - "(?i)сп\\s*60(?:\\.13330)?"
      - "(?i)60\\.13330"

  - id: normative_fire_alarm
    label: normative_fire_alarm
    dataset: normative
    folder_filter: null
    terms:
      - извещател
      - оповещен
      - пожарная сигнализация
      - соуэ
      - сп 484
      - 484.1311500
      - сп 486
      - 486.1311500
      - сп 3.13130
    patterns:
      - "(?i)сп\\s*48[46](?:\\.1311500)?"

  - id: normative_accessibility
    label: normative_accessibility
    dataset: normative
    folder_filter: null
    terms:
      - маломобильн
      - инвалид
      - мгн
      - ограниченной подвижност
      - сп 59
      - 59.13330

  # «По нашему объекту» — это и есть весь сигнал: ответ лежит в проекте, а не
  # в нормативе. Без него «расчёт воздухообмена по нашему объекту» уходил в
  # normative_hvac по слову «воздухообмен» и не мог найти проектный файл.
  # «В нормативах» / «в проекте» — это указание, а не подсказка. Такой домен
  # задаёт датасет сразу, не соревнуясь по очкам с предметной лексикой: иначе
  # «в проекте вентиляция кратность воздухообмена» уходит в ничью, потому что
  # «вентиляция» и «воздухообмен» тянут в нормативы, и область, названную
  # вслух, перевешивает тема разговора.
  - id: normative_scope
    label: normative_scope
    dataset: normative
    folder_filter: null
    authoritative: true
    terms:
      - в нормативах
      - по нормативам
      - в нормативе
      - по нормам
      - в нормах
      - что говорят нормы
      - что говорит норматив
      - по своду правил
      - в своде правил
      - по гост
      - в гост

  - id: project_scope
    label: project_scope
    dataset: project
    folder_filter: null
    authoritative: true
    terms:
      - нашего объекта
      - нашему объекту
      - нашем объекте
      - наш объект
      - нашего проекта
      - в проекте
      - комплект
      - основного комплекта
    patterns:
      - "(?i)(?<!\\w)наш(?:его|ему|ем|)\\s+(?:объект|проект|комплект)"

  # Имя объекта — признак проектного корпуса, но не сказанная вслух область.
  # Намеренно НЕ authoritative: «в нормативах ... для <объекта>» должно уходить в
  # нормативы, а с двумя авторитетными доменами это решал бы счёт, то есть
  # случай. Здесь имя объекта просто добавляет очков проектной стороне.
  - id: project_object
    label: project_object
    dataset: project
    folder_filter: null
    # Названия конкретного объекта сюда не пишутся: репозиторий открыт, а имя
    # объекта и его адрес говорят, чей это проект. Оператор перечисляет их в
    # `config/retrieval_terms.local.yaml` — тот файл в `.gitignore`, и его
    # домен с тем же `id` заменяет этот.
    terms: []

  - id: project_eom
    label: project_eom
    dataset: project
    folder_filter: ЭОМ
    terms:
      - эом
      - электроснабжение
      - электрооборудование
      - освещение
      - кабель

  - id: project_vk
    label: project_vk
    dataset: project
    folder_filter: ВК
    terms:
      - вк
      - водоснабжение
      - канализация
      - водоотведение

  - id: structured_table
    label: structured_table
    # scope: false — домен подсказывает инструмент (extract_structured_values),
    # но не участвует в выборе датасета. С dataset: project слово «расход»
    # загоняло нормативный вопрос в проектные документы.
    scope: false
    dataset: null
    folder_filter: null
    terms:
      - параметр настройки
      - потеря давления
      - падение давления
      - напор
      - расход
      - список систем
      - таблица
      - значение
      - па
      - м3/ч
